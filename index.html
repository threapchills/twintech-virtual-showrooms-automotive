<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eastvaal Motors | Retail Twin</title>
    
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Load React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Styles -->
    <style>
        body { 
            background-color: #f8fafc; /* Slate-50: Very light grey/white */
            color: #0f172a; /* Slate-900: Deep dark blue/black for text */
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }
        
        /* Animation for shimmer */
        @keyframes shimmer {
          0% { background-position: 0% 50%; }
          100% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>

    <!-- React Injection Point -->
    <div id="root"></div>

    <!-- Application Logic -->
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- ICONS ---
        const IconArrowLeft = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        );
        const IconArrowRight = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const IconX = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );
        const IconChevronDown = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );
        const IconScan = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
        );

        // --- ASSETS ---
        const ASSETS = {
            logo: './images/evlogo.png', 
            twintechLogo: './images/ttlogo.png',
            image1: './images/ev1.png',
            image2: './images/ev2.png',
            image3: './images/evinterior.png',
        };

        const FALLBACKS = {
            logo: 'https://placehold.co/400x100/FFFFFF/000000/png?text=EASTVAAL+MOTORS', // Inverted for light mode
            twintechLogo: 'https://placehold.co/200x80/FFFFFF/0ea5e9/png?text=TWINTECH',
            image1: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?q=80&w=2070&auto=format&fit=crop',
            image2: 'https://images.unsplash.com/photo-1562911791-c7a97b729ec5?q=80&w=2787&auto=format&fit=crop',
            image3: 'https://images.unsplash.com/photo-1542362567-b07e54358753?q=80&w=2070&auto=format&fit=crop',
        };

        // --- COMPONENTS ---

        // Adjusted for Light Mode (Darker Chrome effect)
        const LiquidMetal = ({ children, className = "", size = "text-5xl" }) => {
            return (
                <div className={`relative inline-block font-black uppercase tracking-tighter ${className}`}>
                    <svg className="absolute w-0 h-0">
                        <filter id="liquid-metal">
                        <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
                        </filter>
                    </svg>
                    {/* Darker gradient for visibility on white background */}
                    <h2 
                        className={`${size} bg-clip-text text-transparent bg-gradient-to-b from-slate-600 via-slate-900 to-slate-700 relative z-10`}
                        style={{
                        backgroundImage: 'linear-gradient(135deg, #1e293b 0%, #64748b 25%, #1e293b 50%, #64748b 75%, #1e293b 100%)',
                        backgroundSize: '200% 200%',
                        animation: 'shimmer 4s linear infinite',
                        filter: 'url(#liquid-metal)'
                        }}
                    >
                        {children}
                    </h2>
                </div>
            );
        };

        const PanoramaViewer = ({ src, alt }) => {
            const containerRef = useRef(null);
            const [offset, setOffset] = useState(50);

            const handleMouseMove = (e) => {
                if (!containerRef.current) return;
                const { left, width } = containerRef.current.getBoundingClientRect();
                const x = e.clientX - left;
                const percentage = (x / width) * 100;
                setOffset(percentage);
            };

            return (
                // Full width container
                <div className="w-full h-[600px] overflow-hidden relative group border-y-4 border-slate-200">
                    <div className="absolute top-6 left-1/2 -translate-x-1/2 z-10 bg-white/80 backdrop-blur text-slate-900 px-6 py-2 rounded-full text-sm font-bold flex items-center gap-2 shadow-lg">
                        <IconScan size={18} /> Interactive Viewport
                    </div>
                    <div 
                        ref={containerRef}
                        onMouseMove={handleMouseMove}
                        className="h-full w-full cursor-ew-resize relative bg-slate-200"
                    >
                        <img 
                            src={src} 
                            alt={alt}
                            className="absolute h-full max-w-none object-cover transition-transform duration-75 ease-linear"
                            style={{ 
                                left: '50%',
                                transform: `translateX(calc(-${offset}%))` // Center pivot
                            }}
                            onError={(e) => e.target.src = FALLBACKS.image2}
                        />
                    </div>
                </div>
            );
        };

        const MatterportModal = ({ url, isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in duration-300">
                    <div className="w-full h-full max-w-7xl bg-white rounded-xl overflow-hidden border border-slate-200 relative flex flex-col shadow-2xl">
                        <button 
                        onClick={onClose}
                        className="absolute top-4 right-4 z-50 bg-red-600 hover:bg-red-700 text-white p-2 rounded-full transition-colors shadow-lg"
                        >
                        <IconX size={24} />
                        </button>
                        <div className="flex-1 w-full h-full">
                        <iframe 
                            width="100%" 
                            height="100%" 
                            src={url} 
                            frameBorder="0" 
                            allowFullScreen 
                            allow="xr-spatial-tracking"
                        ></iframe>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [activeModal, setActiveModal] = useState(null);

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-cyan-200 selection:text-cyan-900 overflow-x-hidden">
                
                    {/* Modal Layer */}
                    <MatterportModal 
                        isOpen={activeModal === 'left'} 
                        url="https://my.matterport.com/show?play=1&lang=en-US&m=HTXzWg6BPFb" 
                        onClose={() => setActiveModal(null)} 
                    />
                    <MatterportModal 
                        isOpen={activeModal === 'right'} 
                        url="https://my.matterport.com/show?play=1&lang=en-US&m=dpBNKCc1tnb" 
                        onClose={() => setActiveModal(null)} 
                    />

                    {/* --- HERO SECTION --- */}
                    <section className="relative min-h-[80vh] flex flex-col items-center justify-center text-center px-4 pt-20">
                        {/* Subtle Grid Background for Light Mode */}
                        <div className="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px] -z-10"></div>
                        
                        <div className="mb-8 animate-fade-in-down">
                            <img 
                                src={ASSETS.logo} 
                                onError={(e) => e.target.src = FALLBACKS.logo}
                                alt="Eastvaal Motors" 
                                className="h-20 md:h-32 object-contain filter drop-shadow-lg"
                            />
                        </div>

                        <LiquidMetal size="text-6xl md:text-9xl">
                        The Retail<br />Twin Revolution
                        </LiquidMetal>

                        <div className="mt-12 max-w-3xl mx-auto space-y-6">
                            <p className="text-xl md:text-3xl text-slate-600 font-light leading-relaxed">
                                <span className="text-cyan-600 font-bold">28 Brands.</span> One Immersive Hub. <br/>
                                Your Showroom. Everywhere.
                            </p>
                            <div className="flex justify-center pt-12">
                                <IconChevronDown className="animate-bounce text-slate-400" size={40} />
                            </div>
                        </div>
                    </section>

                    {/* --- THE FORK (Image 1 - Full Width) --- */}
                    <section className="py-12 w-full">
                        <div className="text-center mb-8 px-4">
                            <h3 className="text-3xl font-bold text-slate-800 mb-2">Select Your Journey</h3>
                        </div>

                        <div className="w-full relative group overflow-hidden">
                            <img 
                                src={ASSETS.image1} 
                                onError={(e) => e.target.src = FALLBACKS.image1}
                                alt="Eastvaal Choice" 
                                className="w-full h-auto min-h-[500px] object-cover transition-transform duration-1000"
                            />
                            
                            {/* Overlay for better button visibility */}
                            <div className="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors duration-500"></div>

                            {/* Left Arrow (Subtle) */}
                            <div className="absolute top-1/2 left-[15%] md:left-[20%] -translate-y-1/2 z-20">
                                <button 
                                    onClick={() => setActiveModal('left')}
                                    className="w-16 h-16 md:w-20 md:h-20 rounded-full bg-white/20 backdrop-blur-md border border-white/40 flex items-center justify-center hover:bg-cyan-600 hover:border-cyan-500 hover:scale-110 transition-all duration-300 shadow-[0_0_30px_rgba(255,255,255,0.2)] group/btn"
                                >
                                    <IconArrowLeft size={32} className="text-white group-hover/btn:text-white" />
                                </button>
                            </div>

                            {/* Right Arrow (Subtle) */}
                            <div className="absolute top-1/2 right-[15%] md:right-[20%] -translate-y-1/2 z-20">
                                <button 
                                    onClick={() => setActiveModal('right')}
                                    className="w-16 h-16 md:w-20 md:h-20 rounded-full bg-white/20 backdrop-blur-md border border-white/40 flex items-center justify-center hover:bg-cyan-600 hover:border-cyan-500 hover:scale-110 transition-all duration-300 shadow-[0_0_30px_rgba(255,255,255,0.2)] group/btn"
                                >
                                    <IconArrowRight size={32} className="text-white group-hover/btn:text-white" />
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* --- PANORAMA SECTION (Image 2 - Full Screen Width) --- */}
                    <section className="py-20 bg-white">
                        <div className="text-center mb-10 px-4">
                            <LiquidMetal size="text-4xl md:text-7xl">
                                Digital Floor.<br />Infinite Views.
                            </LiquidMetal>
                            <p className="mt-6 text-lg text-slate-500 max-w-2xl mx-auto">
                                Why build walls when you can build worlds?
                            </p>
                        </div>

                        {/* Full Width Panorama */}
                        <PanoramaViewer src={ASSETS.image2} alt="Showroom Panorama" />

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto px-4 mt-16 text-center">
                            <div className="p-6 rounded-xl bg-slate-50 border border-slate-200 shadow-sm hover:shadow-md transition-all">
                                <h4 className="text-cyan-600 font-bold text-xl mb-2">Skyrocket Sales</h4>
                                <p className="text-sm text-slate-500">20–40% rise in lead conversion.</p>
                            </div>
                            <div className="p-6 rounded-xl bg-slate-50 border border-slate-200 shadow-sm hover:shadow-md transition-all">
                                <h4 className="text-cyan-600 font-bold text-xl mb-2">Total Transparency</h4>
                                <p className="text-sm text-slate-500">360° scans kill buyer hesitation.</p>
                            </div>
                            <div className="p-6 rounded-xl bg-slate-50 border border-slate-200 shadow-sm hover:shadow-md transition-all">
                                <h4 className="text-cyan-600 font-bold text-xl mb-2">Google Dominance</h4>
                                <p className="text-sm text-slate-500">SEO gold. Be seen everywhere.</p>
                            </div>
                        </div>
                    </section>

                    {/* --- INTERIOR SECTION (Image 3 - Framed + Full) --- */}
                    <section className="py-20 px-4 bg-slate-50">
                        {/* 1. The Story & Framed Image */}
                        <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16 items-center mb-20">
                            <div className="space-y-8">
                                <h2 className="text-4xl md:text-5xl font-bold text-slate-900 leading-tight">
                                Inside Access.<br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-blue-600">
                                    Seamlessly Integrated.
                                </span>
                                </h2>
                                <p className="text-slate-600 text-lg leading-relaxed">
                                    It's not just about the lot. It's about the leather stitching, the dashboard tech, and that "new car smell" visualized. We take your customers from the parking lot to the driver's seat in one click.
                                </p>
                                <ul className="space-y-4">
                                    {['VR-Ready Walkthroughs', 'Interactive Hotspots', 'Live Spec Sheets'].map((item, i) => (
                                    <li key={i} className="flex items-center gap-3 text-slate-700 font-medium">
                                        <div className="w-2 h-2 bg-cyan-500 rounded-full"></div>
                                        {item}
                                    </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="relative group">
                                <div className="absolute inset-0 bg-gradient-to-tr from-cyan-500/20 to-blue-500/20 rounded-2xl blur-xl group-hover:blur-2xl transition-all duration-500"></div>
                                <img 
                                    src={ASSETS.image3} 
                                    onError={(e) => e.target.src = FALLBACKS.image3}
                                    alt="Car Interior Framed" 
                                    className="relative rounded-2xl shadow-2xl border border-white w-full"
                                />
                            </div>
                        </div>

                        {/* 2. The FULL WIDTH Cinematic Shot */}
                        <div className="w-full max-w-[100vw] overflow-hidden relative mt-12">
                             <div className="absolute top-8 left-8 bg-white/90 backdrop-blur px-4 py-2 rounded text-sm font-bold text-slate-900 z-10 shadow-lg">
                                Driver's Perspective
                             </div>
                             <img 
                                src={ASSETS.image3} 
                                onError={(e) => e.target.src = FALLBACKS.image3}
                                alt="Car Interior Wide" 
                                className="w-full h-[80vh] object-cover object-center"
                             />
                        </div>
                    </section>

                    {/* --- FOOTER --- */}
                    <footer className="py-24 text-center relative bg-white overflow-hidden border-t border-slate-200">
                        <div className="max-w-3xl mx-auto px-4 relative z-10">
                            <h2 className="text-3xl md:text-5xl font-bold text-slate-900 mb-8">
                            Ready to Future-Proof Eastvaal?
                            </h2>
                            <p className="text-slate-500 mb-12 text-lg">
                            Structured rollout. Minimal risk. Maximum ROI. <br/>
                            Let's build the flagship.
                            </p>

                            <div className="mb-20">
                            <button 
                                onClick={() => window.location.href='mailto:mike@twintech.co.za'}
                                className="px-8 py-4 bg-slate-900 text-white font-bold uppercase tracking-widest rounded hover:bg-cyan-600 hover:scale-105 transition-all duration-300 shadow-xl"
                            >
                                Initiate Launch
                            </button>
                            </div>

                            <div className="flex flex-col items-center justify-center gap-6 opacity-60 hover:opacity-100 transition-opacity">
                                <p className="text-sm text-slate-400 uppercase tracking-widest">Powered By</p>
                                <div className="w-48">
                                    <LiquidMetal size="text-3xl">
                                        TWINTECH
                                    </LiquidMetal>
                                </div>
                                <img 
                                    src={ASSETS.twintechLogo} 
                                    onError={(e) => e.target.style.display = 'none'}
                                    alt="Twintech" 
                                    className="h-12 object-contain mt-2"
                                />
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
