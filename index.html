<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eastvaal Motors | Retail Twin</title>
    
    <!-- 1. Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Load React and Babel (This makes the magic code work in the browser) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Styles -->
    <style>
        body { background-color: #050505; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
        
        /* Animation for shimmer */
        @keyframes shimmer {
          0% { background-position: 0% 50%; }
          100% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>

    <!-- This is where React will inject the app -->
    <div id="root"></div>

    <!-- 4. The Application Logic -->
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- ICONS (Recreated here so you don't need to install anything) ---
        const IconArrowLeft = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        );
        const IconArrowRight = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const IconX = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );
        const IconChevronDown = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );
        const IconScan = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
        );

        // --- CONFIGURATION ---
        const ASSETS = {
            logo: './images/evlogo.png', 
            twintechLogo: './images/ttlogo.png',
            image1: './images/ev1.png',
            image2: './images/ev2.png',
            image3: './images/evinterior.png',
        };

        // Fallbacks just in case images aren't found immediately
        const FALLBACKS = {
            logo: 'https://placehold.co/400x100/000000/FFFFFF/png?text=EASTVAAL+MOTORS',
            twintechLogo: 'https://placehold.co/200x80/000000/22d3ee/png?text=TWINTECH',
            image1: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?q=80&w=2070&auto=format&fit=crop',
            image2: 'https://images.unsplash.com/photo-1562911791-c7a97b729ec5?q=80&w=2787&auto=format&fit=crop',
            image3: 'https://images.unsplash.com/photo-1542362567-b07e54358753?q=80&w=2070&auto=format&fit=crop',
        };

        // --- COMPONENTS ---

        const LiquidMetal = ({ children, className = "", size = "text-5xl" }) => {
            return (
                <div className={`relative inline-block font-black uppercase tracking-tighter ${className}`}>
                    <svg className="absolute w-0 h-0">
                        <filter id="liquid-metal">
                        <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
                        </filter>
                    </svg>
                    <h2 
                        className={`${size} bg-clip-text text-transparent bg-gradient-to-b from-gray-300 via-gray-100 to-gray-400 relative z-10 drop-shadow-2xl`}
                        style={{
                        backgroundImage: 'linear-gradient(135deg, #a0a0a0 0%, #ffffff 25%, #a0a0a0 50%, #ffffff 75%, #a0a0a0 100%)',
                        backgroundSize: '200% 200%',
                        animation: 'shimmer 4s linear infinite',
                        filter: 'url(#liquid-metal) drop-shadow(0 0 10px rgba(255,255,255,0.3))'
                        }}
                    >
                        {children}
                    </h2>
                </div>
            );
        };

        const PanoramaViewer = ({ src, alt }) => {
            const containerRef = useRef(null);
            const [offset, setOffset] = useState(50);

            const handleMouseMove = (e) => {
                if (!containerRef.current) return;
                const { left, width } = containerRef.current.getBoundingClientRect();
                const x = e.clientX - left;
                const percentage = (x / width) * 100;
                setOffset(percentage);
            };

            return (
                <div className="w-full max-w-6xl mx-auto my-12 overflow-hidden rounded-2xl shadow-[0_0_50px_rgba(0,255,255,0.15)] border border-slate-700 relative group">
                    <div className="absolute top-4 right-4 z-10 bg-black/70 backdrop-blur text-cyan-400 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2">
                        <IconScan size={18} /> Interactive Viewport
                    </div>
                    <div 
                        ref={containerRef}
                        onMouseMove={handleMouseMove}
                        className="h-[500px] w-full cursor-ew-resize relative bg-slate-900"
                    >
                        <img 
                            src={src} 
                            alt={alt}
                            className="absolute h-full max-w-none object-cover transition-transform duration-100 ease-out"
                            style={{ 
                                left: '50%',
                                transform: `translateX(calc(-${offset}%))`
                            }}
                            onError={(e) => e.target.src = FALLBACKS.image2}
                        />
                        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 pointer-events-none opacity-50 group-hover:opacity-0 transition-opacity duration-300">
                        <div className="bg-black/50 px-4 py-1 rounded text-white text-xs tracking-widest uppercase">
                            Move cursor to look around
                        </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MatterportModal = ({ url, isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 animate-in fade-in duration-300">
                    <div className="w-full h-full max-w-7xl bg-black rounded-xl overflow-hidden border border-slate-700 relative flex flex-col shadow-2xl">
                        <button 
                        onClick={onClose}
                        className="absolute top-4 right-4 z-50 bg-red-600 hover:bg-red-700 text-white p-2 rounded-full transition-colors"
                        >
                        <IconX size={24} />
                        </button>
                        <div className="flex-1 w-full h-full">
                        <iframe 
                            width="100%" 
                            height="100%" 
                            src={url} 
                            frameBorder="0" 
                            allowFullScreen 
                            allow="xr-spatial-tracking"
                        ></iframe>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [activeModal, setActiveModal] = useState(null);

            return (
                <div className="min-h-screen bg-[#050505] text-white font-sans selection:bg-cyan-500 selection:text-black overflow-x-hidden">
                
                    {/* Modal Layer */}
                    <MatterportModal 
                        isOpen={activeModal === 'left'} 
                        url="https://discover.matterport.com/space/HTXzWg6BPFb" 
                        onClose={() => setActiveModal(null)} 
                    />
                    <MatterportModal 
                        isOpen={activeModal === 'right'} 
                        url="https://my.matterport.com/show?play=1&lang=en-US&m=dpBNKCc1tnb" 
                        onClose={() => setActiveModal(null)} 
                    />

                    {/* --- HERO SECTION --- */}
                    <section className="relative min-h-[90vh] flex flex-col items-center justify-center text-center px-4">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-800/20 via-[#050505] to-[#050505] -z-10"></div>
                        
                        <div className="mb-8 animate-pulse">
                        <img 
                            src={ASSETS.logo} 
                            onError={(e) => e.target.src = FALLBACKS.logo}
                            alt="Eastvaal Motors" 
                            className="h-20 md:h-32 object-contain drop-shadow-[0_0_25px_rgba(255,255,255,0.2)]"
                        />
                        </div>

                        <LiquidMetal size="text-5xl md:text-8xl">
                        The Retail<br />Twin Revolution
                        </LiquidMetal>

                        <div className="mt-12 max-w-2xl mx-auto space-y-6">
                        <p className="text-xl md:text-2xl text-gray-400 font-light leading-relaxed">
                            <span className="text-cyan-400 font-bold">28 Brands.</span> One Immersive Hub. <br/>
                            Your Showroom. Everywhere. Always Open.
                        </p>
                        <div className="flex justify-center pt-8">
                            <IconChevronDown className="animate-bounce text-gray-600" size={40} />
                        </div>
                        </div>
                    </section>

                    {/* --- THE FORK (Image 1) --- */}
                    <section className="py-20 px-4 md:px-8 relative">
                        <div className="max-w-6xl mx-auto text-center mb-12">
                        <h3 className="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-200 to-blue-500 mb-4">
                            From Couch to Car Key
                        </h3>
                        <p className="text-gray-400 text-lg">
                            Stop selling cars. Start selling <span className="text-white italic">dreams</span>. Click below to teleport.
                        </p>
                        </div>

                        <div className="max-w-5xl mx-auto relative rounded-2xl overflow-hidden shadow-2xl group border border-slate-800">
                        <img 
                            src={ASSETS.image1} 
                            onError={(e) => e.target.src = FALLBACKS.image1}
                            alt="Eastvaal Choice" 
                            className="w-full h-auto object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-700"
                        />
                        
                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-black/40 pointer-events-none"></div>

                        {/* Left Arrow */}
                        <div className="absolute top-1/2 left-4 md:left-10 -translate-y-1/2 z-20">
                            <button 
                            onClick={() => setActiveModal('left')}
                            className="group/btn flex flex-col items-center gap-3"
                            >
                            <div className="w-16 h-16 md:w-24 md:h-24 rounded-full bg-white/10 backdrop-blur-md border border-white/30 flex items-center justify-center group-hover/btn:bg-cyan-500 group-hover/btn:scale-110 transition-all duration-300 shadow-[0_0_30px_rgba(0,255,255,0.3)]">
                                <IconArrowLeft size={32} className="text-white" />
                            </div>
                            <span className="text-white font-bold text-sm md:text-lg uppercase tracking-widest bg-black/50 px-3 py-1 rounded">Discovery</span>
                            </button>
                        </div>

                        {/* Right Arrow */}
                        <div className="absolute top-1/2 right-4 md:right-10 -translate-y-1/2 z-20">
                            <button 
                            onClick={() => setActiveModal('right')}
                            className="group/btn flex flex-col items-center gap-3"
                            >
                            <div className="w-16 h-16 md:w-24 md:h-24 rounded-full bg-white/10 backdrop-blur-md border border-white/30 flex items-center justify-center group-hover/btn:bg-purple-600 group-hover/btn:scale-110 transition-all duration-300 shadow-[0_0_30px_rgba(147,51,234,0.3)]">
                                <IconArrowRight size={32} className="text-white" />
                            </div>
                            <span className="text-white font-bold text-sm md:text-lg uppercase tracking-widest bg-black/50 px-3 py-1 rounded">Virtual Tour</span>
                            </button>
                        </div>

                        <div className="absolute bottom-6 w-full text-center pointer-events-none">
                            <p className="text-white/60 text-sm uppercase tracking-widest">Select your journey</p>
                        </div>
                        </div>
                    </section>

                    {/* --- PANORAMA SECTION (Image 2) --- */}
                    <section className="py-20 bg-gradient-to-b from-[#050505] to-[#0a0a0a] overflow-hidden">
                        <div className="text-center mb-10 px-4">
                        <LiquidMetal size="text-4xl md:text-7xl">
                            Your Digital Floor.<br />Infinite Possibilities.
                        </LiquidMetal>
                        <p className="mt-8 text-lg text-gray-400 max-w-2xl mx-auto">
                            Why build walls when you can build worlds? <br/>
                            Google loves it. Customers love it. <span className="text-green-400 font-bold">Sales teams need it.</span>
                        </p>
                        </div>

                        <PanoramaViewer src={ASSETS.image2} alt="Showroom Panorama" />

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto px-4 mt-12 text-center">
                        <div className="p-6 border border-slate-800 rounded-xl bg-slate-900/50 backdrop-blur hover:border-cyan-500/50 transition-colors">
                            <h4 className="text-cyan-400 font-bold text-xl mb-2">Skyrocket Sales</h4>
                            <p className="text-sm text-gray-400">20–40% rise in lead conversion.</p>
                        </div>
                        <div className="p-6 border border-slate-800 rounded-xl bg-slate-900/50 backdrop-blur hover:border-purple-500/50 transition-colors">
                            <h4 className="text-purple-400 font-bold text-xl mb-2">Total Transparency</h4>
                            <p className="text-sm text-gray-400">360° scans kill buyer hesitation.</p>
                        </div>
                        <div className="p-6 border border-slate-800 rounded-xl bg-slate-900/50 backdrop-blur hover:border-green-500/50 transition-colors">
                            <h4 className="text-green-400 font-bold text-xl mb-2">Google Dominance</h4>
                            <p className="text-sm text-gray-400">SEO gold. Be seen everywhere.</p>
                        </div>
                        </div>
                    </section>

                    {/* --- INTERIOR SECTION (Image 3) --- */}
                    <section className="py-20 px-4 relative">
                        <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                        <div className="order-2 lg:order-1 space-y-8">
                            <h2 className="text-4xl md:text-5xl font-bold text-white leading-tight">
                            Inside Access.<br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-yellow-500">
                                Seamlessly Integrated.
                            </span>
                            </h2>
                            <p className="text-gray-400 text-lg leading-relaxed">
                            It's not just about the lot. It's about the leather stitching, the dashboard tech, and that "new car smell" visualized. We take your customers from the parking lot to the driver's seat in one click.
                            </p>
                            <ul className="space-y-4">
                                {['VR-Ready Walkthroughs', 'Interactive Hotspots', 'Live Spec Sheets'].map((item, i) => (
                                <li key={i} className="flex items-center gap-3 text-gray-300">
                                    <div className="w-2 h-2 bg-cyan-500 rounded-full shadow-[0_0_10px_#06b6d4]"></div>
                                    {item}
                                </li>
                                ))}
                            </ul>
                        </div>

                        <div className="order-1 lg:order-2 relative group">
                            <div className="absolute inset-0 bg-gradient-to-tr from-cyan-500/20 to-purple-500/20 rounded-2xl blur-xl group-hover:blur-2xl transition-all duration-500"></div>
                            <img 
                            src={ASSETS.image3} 
                            onError={(e) => e.target.src = FALLBACKS.image3}
                            alt="Car Interior" 
                            className="relative rounded-2xl shadow-2xl border border-slate-700 w-full"
                            />
                            <div className="absolute bottom-4 right-4 bg-black/60 backdrop-blur px-3 py-1 rounded text-xs text-white/80 border border-white/10">
                            Actual Digital Twin Capture
                            </div>
                        </div>
                        </div>
                    </section>

                    {/* --- FOOTER --- */}
                    <footer className="py-24 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-900 to-transparent"></div>
                        
                        <div className="max-w-3xl mx-auto px-4 relative z-10">
                            <h2 className="text-3xl md:text-5xl font-bold text-white mb-8">
                            Ready to Future-Proof Eastvaal?
                            </h2>
                            <p className="text-gray-400 mb-12 text-lg">
                            Structured rollout. Minimal risk. Maximum ROI. <br/>
                            Let's build the flagship.
                            </p>

                            <div className="mb-20">
                            <button 
                                onClick={() => window.location.href='mailto:mike@twintech.co.za'}
                                className="px-8 py-4 bg-white text-black font-bold uppercase tracking-widest rounded hover:bg-cyan-400 hover:scale-105 transition-all duration-300 shadow-[0_0_40px_rgba(255,255,255,0.3)]"
                            >
                                Initiate Launch
                            </button>
                            </div>

                            <div className="flex flex-col items-center justify-center gap-6 opacity-80 hover:opacity-100 transition-opacity">
                            <p className="text-sm text-gray-500 uppercase tracking-widest">Powered By</p>
                            <div className="w-48">
                                <LiquidMetal size="text-3xl">
                                    TWINTECH
                                </LiquidMetal>
                            </div>
                            <img 
                                src={ASSETS.twintechLogo} 
                                onError={(e) => e.target.style.display = 'none'}
                                alt="Twintech" 
                                className="h-12 object-contain mt-2"
                            />
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // RENDER THE APP
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
